<!DOCTYPE html>
<html lang="en">

<?
  // every field the form collects, grouped; empty answers show as "-"

    { title: 'Study plans', rows: [['Course', lead.course], ['Level of study', lead.level], ['Preferred city', lead.city], ['Shortlisted universities', lead.universities]] },
    { title: 'Counselling call', rows: [['Preferred call time', lead.callTime]] },
    { title: 'Lead details', rows: [['Date', date], ['Time', time], ['Lead source', lead.source], ['Submitted from', lead.page], ['Sheet row', 'Row ' + row]] }
  ];
  const chips = [lead.course, lead.level, lead.city].filter(Boolean);
?>

          <td valign="top" width="34%" style="padding:11px 16px;<?= last ? '' : 'border-bottom:1px solid #F1E9DB;' ?>font-size:13px;color:#4B6564;"><?= label ?></td>

          <td valign="top" style="padding:11px 16px;<?= last ? '' : 'border-bottom:1px solid #F1E9DB;' ?>font-size:14px;font-weight:bold;color:#0A3B3C;"><?= value ?></td>
          <? } else { ?>
          <td valign="top" style="padding:11px 16px;<?= last ? '' : 'border-bottom:1px solid #F1E9DB;' ?>font-size:14px;font-weight:bold;color:#9AA9A8;">-</td>

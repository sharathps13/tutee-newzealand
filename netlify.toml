# Netlify site configuration — one Netlify site per country landing page.
#
# Canonical copy: _tooling/netlify/netlify.toml. Pushed into every country
# folder by _tooling/install_netlify.py. Edit it there, never in a country
# folder — the installer asserts the copies are identical.
#
# There is no build step. The site is plain static HTML/CSS/JS plus one
# dependency-free function, so Netlify publishes the folder as-is. Nothing to
# install, nothing to compile, no package.json to drift.

[build]
  publish = "."
  functions = "netlify/functions"

# Node 18+ gives the function global fetch, which is why it needs no npm deps.
[build.environment]
  NODE_VERSION = "20"

# The pages post to /api/enquiry (same origin). The function claims that path
# itself via `export const config`. No redirect here: a function with its own
# path is no longer served at /.netlify/functions/enquiry, so a forced redirect
# to that address turns every enquiry into a 404.

# Deep links such as /nz-universities are real files, so no SPA catch-all is
# wanted here — a bad URL should 404 rather than silently render the home page.

# ------------------------------------------------- legacy directory: 301
# universities.html is an older copy of the directory (older template). Its
# address and the extensionless form go permanently to the current directory, so
# there is one indexable directory page. /nz-universities itself is a real file
# and has no rule.
[[redirects]]
  from = "/universities.html"
  to = "/nz-universities"
  status = 301
  force = true

[[redirects]]
  from = "/universities"
  to = "/nz-universities"
  status = 301
  force = true

# ------------------------------------------------- repository files: 404
# publish = "." deploys the whole repository, so the working files that sit next
# to the pages (notes, design previews, build scripts, the Apps Script source,
# the function source) would otherwise be public and crawlable. These forced
# rules answer them with the site's 404 page instead. Apart from the two legacy
# directory redirects above they are the only redirects in this file, and none of
# them touches /api/*, /.netlify/*, /assets/*, the current HTML pages, robots.txt
# or sitemap.xml, so the enquiry note above still holds.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/serve.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/Start%20Local%20Server.command"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/Start Local Server.command"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/apps-script/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/design-preview/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# ----------------------------------------------------------------- headers
[[headers]]
  for = "/*"
  [headers.values]
    # The pages load no third-party styles, fonts or images. The only third-party
    # script is Google's gtag.js from www.googletagmanager.com, which
    # assets/js/analytics.js adds only once GA_ID is set and the visitor has
    # accepted analytics; GA4 then sends hits to *.google-analytics.com /
    # *.analytics.google.com (connect-src, img-src). script-src stays strict with
    # no 'unsafe-inline'. style-src does need it: the markup carries 173 inline
    # style="" attributes inherited from the original design.
    Content-Security-Policy = """
      default-src 'self'; \
      script-src 'self' https://www.googletagmanager.com; \
      style-src 'self' 'unsafe-inline'; \
      img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; \
      font-src 'self'; \
      connect-src 'self' https://*.supabase.co https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; \
      form-action 'self'; \
      base-uri 'self'; \
      object-src 'none'; \
      frame-ancestors 'none'"""
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"

# HTML is regenerated by the build scripts, so it must never be served stale.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# JS and CSS filenames are stable across rebuilds (main.js, main.css), so they
# cannot be cached immutably — a content change would never reach a returning
# visitor. Revalidate on every load; Netlify serves a 304 when unchanged.
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fonts and photographs are effectively content-addressed by name — they change
# only when deliberately replaced — so they can be cached hard.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The enquiry endpoint must never be cached by a proxy.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
